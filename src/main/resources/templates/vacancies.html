<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вакансии</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>
<h1>Вакансии (всего: <span th:text="${vacancies.size()}">0</span>)</h1>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Компания</th>
        <th>Город</th>
        <th>Зарплата</th>
        <th>Дата</th>
        <th>Требования</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="v : ${vacancies}">
        <td th:text="${v.id}">1</td>
        <td th:text="${v.title}">...</td>
        <td th:text="${v.company}">...</td>
        <td th:text="${v.city}">...</td>
        <td th:text="${v.salary}">...</td>
        <td th:text="${v.datePosted}">...</td>
        <td th:text="${v.requirements}">...</td>
    </tr>
    </tbody>
</table>

<p th:if="${vacancies.isEmpty()}">Вакансий нет.</p>
</body>
</html>
